#
# Schema:
#   - title: SOSP                    # short name shown in the list
#     year: 2027
#     id: sosp27                      # unique, lower case, used in URLs/CSS ids
#     full_name: ...                  # optional, shown on the detail page
#     link: https://...               # official conference / CFP page
#     deadline: "YYYY-MM-DD HH:MM:SS" # full paper deadline (or "TBA")
#     abstract_deadline: "..."        # optional
#     timezone: AoE                   # AoE, UTC, UTC-4, PST or an IANA name
#     place: City, Country
#     date: Month D-D, 2027           # conference dates
#     sub: [ SYS ]                    # categories, see _data/types.yml
#     tba: true                       # set when the dates are projected, not official
#     note: ...                       # optional free text shown under the entry
#
# Entries marked `tba: true` use dates projected from the previous edition
# because the official CFP has not been released yet. Replace them (and drop
# the flag and the note) once the real CFP is out.

