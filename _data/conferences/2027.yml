# Conferences whose *event* takes place in 2027.
# The file is named after the conference year, not the submission year: a
# December 2026 deadline for a July 2027 conference belongs here.
#
# POLICY: only deadlines from a published call for papers go in this file.
# Do not add a date extrapolated from a previous edition - if the CFP is not
# out yet, leave the conference out until it is.
#
# Every entry below was cross-checked against the conference's own CFP or
# important-dates page in September 2026. The `link` points at that page;
# re-check it before you rely on a date, since organizers do move deadlines.
#
# Schema:
#   - title: OSDI                        # short name shown in the list
#     year: 2027
#     id: osdi27                          # unique, lower case, used in URLs/CSS ids
#     full_name: ...                      # optional, shown on the detail page
#     link: https://...                   # the CFP / important-dates page
#     abstract_deadline: "..."            # optional, omit when the CFP has none
#     deadline: "YYYY-MM-DD HH:MM:SS"     # full paper deadline
#     timezone: AoE                       # AoE, UTC, UTC-4, PST or an IANA name
#     place: City, Country
#     date: Month D-D, 2027               # conference dates
#     sub: [ SYS ]                        # categories, see _data/types.yml
#     note: ...                           # optional free text shown under the entry

