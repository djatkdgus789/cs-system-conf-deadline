# Conferences this repository tracks that have no entry in _data/conferences/
# yet, because their next call for papers has not been published.
#
# `scripts/check_updates.py` reads this file weekly and reports when a
# community dataset starts listing an upcoming deadline for one of them, so
# somebody can go and confirm it against `cfp` and add a real entry.
#
#   name    display name
#   ccfddl  basename of the file in ccfddl/ccf-deadlines/conference/*/ that
#           covers this series, or null when the dataset does not track it
#   cfp     the page to confirm a date against before adding an entry
#   sub     the category the entry would get
#   status  what is known as of the last sweep (free text, for humans)

