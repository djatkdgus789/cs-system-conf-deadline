---

# Papers submitted and accepted per year, 2017-2026, keyed by conference
# series the same way as _data/rankings.yml ("EuroSys (Fall)" reads
# "EuroSys"). `year` is the conference year. Multi-round conferences (NSDI,
# ASPLOS, SIGMOD, SIGMETRICS, ...) are summed across all rounds of that year.
#
# Drawn as the small chart beside each deadline on the front page. A series
# with no row here gets no chart; a missing year is a gap, not a zero.
#
# Where the only official source gives a percentage and no counts, the row
# is `{ year, rate, source }` with rate as a fraction (0.2353 = 23.53%); it
# is drawn as a point on the rate line with no bar.
#
# Sources, merged 2026-10-12:
#
#   csconferences   emeryberger/csconferences, csconferences.csv (2026-07-07).
#                   Used first wherever it has the year.
#   ccf-deadlines   ccfddl/ccf-deadlines, accept_rates/ (2026-10-11). Fills
#                   years and conferences csconferences lacks; every row it
#                   contributed carries its own `source`.
#
#   targeted search  2026-10-14: years neither dataset had, filled one by one
#                   from documents that state the counts - proceedings front
#                   matter and chairs' messages, ACM DL acceptance tables,
#                   official programs and history/statistics pages, and the
#                   submitted/accepted counts on a year's HotCRP front page. Each
#                   such row links its document in `source`.
#   sysconf         eitanf/sysconf (Frachtenberg's dataset of 2017 systems
#                   conferences, compiled from proceedings) for 2017 only,
#                   where nothing first-party was found and the record counts
#                   main-track full papers only (CLOUD 2017 mixes tracks
#                   there and was left out; CCGrid 2017 uses the record's
#                   own note of 59 full papers, not its 72 with short ones).
#
# Some conferences publish only a percentage (Middleware's history page,
# IEEE BigData's calls for papers, FPGA 2025's front matter); those years
# are rate-only rows.
#
# Where both had the same year and disagreed (14 cases), the value backed by
# the more official document was kept - a PC chairs' message or proceedings
# front matter over a trip report or published analysis, over a HotCRP page
# count or a third-party tracker, over personal communication, over nothing:
#
#   taken from ccf-deadlines:  FAST 2025, HPCA 2022, ISCA 2022, MICRO 2021,
#                              NSDI 2022, OSDI 2022 (chairs' messages / SIGARCH
#                              reports), VLDB 2021 and 2022 (VLDB Journal)
#   kept from csconferences:   IMC 2021 and 2023 (ACM front matter; the other
#                              dataset had HotCRP counts 40% higher), RTAS
#                              2023 and 2024 (IEEE front matter), SOSP 2025
#                              (official accepted list), ICDE 2024 (PC chair)
#
# Acceptance counts are public; submission counts often are not, and different
# documents count withdrawn and desk-rejected papers differently. Treat a few
# percent of disagreement between sources as normal.

