# Venue rankings, keyed by conference series. The key is an entry's title up to
# " (" - "EuroSys (Fall)" looks up "EuroSys" - or a watchlist name.
#
#   core        ICORE2026 rank: A*, A, B, C, or one of ICORE's non-letter
#               categories: "National: USA", "National: Israel", "Journal"
#               (ICORE does not rank venues whose papers appear in a journal),
#               "Merged" (folded into another venue, no rank of its own).
#               Omitted when ICORE does not list the venue.
#   csrankings  main  - counted by CSRankings by default
#               next  - a CSRankings "next tier" venue, counted only when the
#                       next-tier box is ticked
#               Omitted when CSRankings does not count the venue.
#   kiise       최우수 or 우수 in KIISE's 2024 top-conference list.
#               Omitted when the venue is not on that list.
#   note        Free text shown on the detail page.
#
# Sources, checked 2026-10-12:
#
#   ICORE2026   The ICORE (formerly CORE) portal, portal.core.edu.au/conf-ranks,
#               via its per-edition CSV export as mirrored in
#               rabimba/ConferenceRank (scraper/data/core.json, 2026-10-05).
#               Spot-checked against the portal for NSDI, SenSys, EDBT and
#               PPoPP; all four matched.
#   CSRankings  emeryberger/CSrankings at 2026-09-28: the venue lists in
#               util/csrankings.py (areadict) and the nextTier table in
#               src/config.ts.
#   KIISE       2024년 한국정보과학회 우수학술대회 (개편)목록,
#               kiise.or.kr/TopConferences/data/SW분야우수학술대회목록_2024.pdf,
#               as transcribed in gist.github.com/Pusnow/6eb933355b5cb8d31ef1abcb3c3e1206.
#               The transcription has 73 최우수 and 143 우수 venues once its
#               oral/poster/spotlight rows are merged, which is exactly the
#               PDF's own summary (216 = 73 + 143).
#
# These lists change on their own schedules (ICORE every few years, KIISE every
# few years, CSRankings whenever its maintainer decides). Re-check them when a
# new edition is announced, not on the weekly CFP sweep.

# ---------------------------------------------------------------- System ----

